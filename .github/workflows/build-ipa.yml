name: Build iOS Safari Extension IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Debug Workspace
        run: |
          echo "Current Working Directory:"
          pwd
          echo "Files in Workspace:"
          ls -la
          echo "Workspace Env Path: $GITHUB_WORKSPACE"

      - name: Convert to Safari Web Extension
        run: |
          # Buat folder bersih untuk memisahkan file ekstensi dari folder build Xcode
          mkdir -p extension_src
          cp manifest.json extension_src/
          cp popup.html extension_src/
          cp popup.css extension_src/
          cp popup.js extension_src/
          cp background.js extension_src/
          cp -r icons extension_src/
          
          # Konversi ekstensi menggunakan folder bersih sebagai input
          xcrun safari-web-extension-converter --bundle-identifier "com.curls1337.cookieloader" --app-name "CookieLoader" --ios-only --copy-resources --no-open extension_src

      - name: Build Xcode Project (Unsigned)
        run: |
          # Mengompilasi proyek menjadi aplikasi iOS (.app) tanpa code signing ke folder build lokal dengan target iOS 15.0
          xcodebuild -project CookieLoader/CookieLoader.xcodeproj \
                     -scheme "CookieLoader" \
                     -sdk iphoneos \
                     -configuration Release \
                     SYMROOT=$PWD/build \
                     IPHONEOS_DEPLOYMENT_TARGET=15.0 \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     clean build

      - name: Package IPA
        run: |
          # Membuat folder Payload untuk membungkus .app menjadi .ipa
          mkdir -p Payload
          cp -r build/Release-iphoneos/CookieLoader.app Payload/
          zip -r "CookieLoader_Unsigned.ipa" Payload/
          echo "IPA Package created successfully."

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CookieLoader-iOS-Unsigned-IPA
          path: CookieLoader_Unsigned.ipa
