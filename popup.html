<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cookie Auto Loader Premium</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="logo-area">
        <div class="logo-glow"></div>
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2a10 10 0 1 0 10 10H12V2z" />
          <path d="M12 2a10 10 0 0 1 10 10h-10V2z" opacity="0.5" />
          <circle cx="7.5" cy="7.5" r="1" fill="currentColor" />
          <circle cx="16.5" cy="16.5" r="1" fill="currentColor" />
          <circle cx="7.5" cy="16.5" r="1" fill="currentColor" />
          <circle cx="12" cy="12" r="1" fill="currentColor" />
        </svg>
        <div class="logo-text">
          <h1>Cookie Loader</h1>
          <span class="logo-subtitle">Premium Auto-Injector</span>
        </div>
      </div>
      
      <div class="stats-container">
        <div class="stat-badge" id="stat-total-profiles" title="Total Profiles Imported">
          <span class="stat-val">0</span>
          <span class="stat-lbl">Profiles</span>
        </div>
        <div class="stat-badge" id="stat-total-countries" title="Unique Countries">
          <span class="stat-val">0</span>
          <span class="stat-lbl">Countries</span>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="app-body">
      <!-- Import Zone -->
      <div class="drop-zone" id="drop-zone">
        <input type="file" id="file-input" multiple accept=".txt" style="display: none;">
        <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9.75m0 0l3 3m-3-3l-3 3M6.75 19.5a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.233-2.33 3 3 0 013.758 3.848A3.752 3.752 0 0118 19.5H6.75z" />
        </svg>
        <div class="drop-text">
          <p class="primary-text">Drag & Drop Cookie Files</p>
          <p class="secondary-text">or <span class="highlight">browse files</span> (.txt)</p>
        </div>
      </div>

      <!-- Toolbar Controls -->
      <div class="toolbar">
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
          <input type="text" id="search-input" placeholder="Search profiles, plans, emails...">
        </div>

        <div class="filter-box">
          <select id="country-filter">
            <option value="">All Countries</option>
          </select>
        </div>
      </div>

      <!-- Action Buttons Row -->
      <div class="action-bar">
        <button class="btn btn-secondary flex-btn" id="btn-clear-cookies" title="Delete current site cookies">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
            <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636" />
          </svg>
          Clear Cookies
        </button>
        <button class="btn btn-danger flex-btn" id="btn-delete-all" title="Clear all saved profiles from storage">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
          </svg>
          Clear Storage
        </button>
      </div>

      <!-- List Container -->
      <div class="list-wrapper">
        <div class="list-header">
          <span>Cookie Profiles</span>
          <span class="count-indicator" id="visible-count">0 showing</span>
        </div>
        <div class="profile-list" id="profile-list">
          <!-- Profiles dynamically populated here -->
          <div class="empty-state" id="empty-state">
            <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
              <path stroke-linecap="round" stroke-linejoin="round" d="M20.25 7.5l-.625 10.632a2.25 2.25 0 01-2.247 2.118H6.622a2.25 2.25 0 01-2.247-2.118L3.75 7.5M10 11.25h4M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125z" />
            </svg>
            <p class="empty-primary">No Profiles Loaded</p>
            <p class="empty-secondary">Import cookie text files using the drag zone above to get started.</p>
          </div>
        </div>
      </div>
    </main>

    <!-- Toast Notification -->
    <div class="toast-container" id="toast-container"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
